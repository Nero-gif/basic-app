<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Browse People</title>
    <link rel="stylesheet" th:href="@{/globalstyle.css}">
</head>
<body>
<div>
    <h1>People</h1>
    <form action="/browsePeople" method="get">
        <input type="text" name="search" th:value="${search}">
        <button type="submit">Search</button>
    </form>

    <table border="1">
        <tr>
            <th>First name</th>
            <th>Last name</th>
            <th>Biological gender</th>
        </tr>
        <tr th:each="person : ${people}">
            <td th:text="${person.firstName}"></td>
            <td th:text="${person.lastName}"></td>
            <td th:text="${person.gender}"></td>
        </tr>
    </table>
    <a href="/admin"><button>Back</button></a>
</div>
</body>
</html>
